<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/user/trangChu}">
<head>
    <meta charset="UTF-8">
    <title>Thông Tin Khách Hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
</head>
<body data-topbar="dark">

<div layout:fragment="contentUser" class="bg-light py-5">
    <!-- Product Detail -->
    <section class="sec-product-detail bg-white p-t-65 p-b-60">
        <div class="container">
            <form action="/updatekhachhang" method="post" id="updateForm">
                <!-- Hiển thị thông báo lỗi -->
                <div th:if="${error}" class="alert alert-danger">
                    <p th:text="${error}"></p>
                </div>

                <!-- Họ và tên -->
                <div class="mb-3">
                    <label for="hoTen" class="form-label">Họ và tên:</label>
                    <input type="text" id="hoTen" name="hoTen" class="form-control" th:value="${khachHang.hoTen}" required />
                </div>

                <!-- Giới tính -->
                <div class="mb-3">
                    <label for="gioiTinh" class="form-label">Giới tính:</label>
                    <select id="gioiTinh" name="gioiTinh" class="form-select">
                        <option value="true" th:selected="${khachHang.gioiTinh}">Nam</option>
                        <option value="false" th:selected="${!khachHang.gioiTinh}">Nữ</option>
                    </select>
                </div>

                <!-- Ngày sinh -->
                <div class="mb-3">
                    <label for="ngaySinh" class="form-label">Ngày sinh:</label>
                    <input type="date" id="ngaySinh" name="ngaySinh" class="form-control" th:value="${khachHang.ngaySinh}" required />
                    <div id="ngaySinhError" class="text-danger" style="display: none;">Ngày sinh không được là ngày trong tương lai!</div>
                </div>

                <script>
                    // JavaScript validation cho Ngày sinh
                    document.getElementById('ngaySinh').addEventListener('change', function() {
                        var ngaySinhInput = this.value;
                        var currentDate = new Date().toISOString().split('T')[0]; // Lấy ngày hiện tại

                        // Kiểm tra nếu ngày sinh là ngày trong tương lai
                        if (ngaySinhInput > currentDate) {
                            document.getElementById('ngaySinhError').style.display = 'block'; // Hiển thị lỗi
                            this.setCustomValidity("Ngày sinh không được là ngày trong tương lai!");
                        } else {
                            document.getElementById('ngaySinhError').style.display = 'none'; // Ẩn lỗi
                            this.setCustomValidity(""); // Xóa lỗi
                        }
                    });
                </script>

                <!-- Số điện thoại -->
                <div class="mb-3">
                    <label for="soDienThoai" class="form-label">Số điện thoại:</label>
                    <input type="text" id="soDienThoai" name="soDienThoai" class="form-control" th:value="${khachHang.soDienThoai}"
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" th:value="${khachHang.email}" required />
                </div>
                <!-- Submit button -->
                <div class="d-flex justify-content-center">
                    <button type="button" id="submitBtn" class="btn btn-primary">Cập nhật thông tin</button>
                </div>

                <script>
                    // Đảm bảo tài liệu đã được tải đầy đủ trước khi thêm sự kiện
                    document.addEventListener("DOMContentLoaded", function() {
                        document.getElementById('submitBtn').addEventListener('click', function(event) {
                            // Hiển thị hộp thoại xác nhận
                            alertify.confirm('Xác nhận', 'Bạn có chắc chắn muốn cập nhật thông tin?',
                                function() {
                                    // Nếu người dùng nhấn "OK", gửi form
                                    document.getElementById('updateForm').submit();
                                },
                                function() {
                                    // Nếu người dùng nhấn "Cancel", không làm gì cả
                                    alertify.error('Hủy cập nhật!');
                                });
                        });
                    });
                </script>
            </form>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
