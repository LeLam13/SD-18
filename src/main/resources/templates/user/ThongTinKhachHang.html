<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/user/trangChu}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Thông Tin Khách Hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
  </head>
  <body data-topbar="dark">
    <div layout:fragment="contentUser" class="bg-light py-5">
      <!-- Customer Info Form -->
      <section class="sec-product-detail bg-white p-t-65 p-b-60">
        <div class="container">
          <form action="/updatekhachhang" method="post" id="updateForm">
            <!-- Error message display -->
            <div th:if="${error}" class="alert alert-danger">
              <p th:text="${error}"></p>
            </div>

            <!-- Customer Info Fields -->
            <div class="mb-3">
              <label for="hoTen" class="form-label">Họ và tên:</label>
              <input
                type="text"
                id="hoTen"
                name="hoTen"
                class="form-control"
                th:value="${khachHang.hoTen}"
                required
              />
            </div>
            <div class="mb-3">
              <label for="gioiTinh" class="form-label">Giới tính:</label>
              <select id="gioiTinh" name="gioiTinh" class="form-select">
                <option value="true" th:selected="${khachHang.gioiTinh}">
                  Nam
                </option>
                <option value="false" th:selected="${!khachHang.gioiTinh}">
                  Nữ
                </option>
              </select>
            </div>
            <div class="mb-3">
              <label for="ngaySinh" class="form-label">Ngày sinh:</label>
              <input
                type="date"
                id="ngaySinh"
                name="ngaySinh"
                class="form-control"
                th:value="${khachHang.ngaySinh}"
                required
              />
              <div id="ngaySinhError" class="text-danger" style="display: none">
                Ngày sinh không được là ngày trong tương lai!
              </div>
            </div>
            <div class="mb-3">
              <label for="soDienThoai" class="form-label">Số điện thoại:</label>
              <input
                type="text"
                id="soDienThoai"
                name="soDienThoai"
                class="form-control"
                th:value="${khachHang.soDienThoai}"
              />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                th:value="${khachHang.email}"
                required
              />
            </div>
            <div class="d-flex justify-content-center">
              <button type="submit" class="btn btn-primary">
                Cập nhật thông tin
              </button>
            </div>
          </form>

          <!-- Display Customer's Purchase History -->
          <div
            th:if="${purchaseHistory != null and !purchaseHistory.isEmpty()}"
          >
            <table
              class="table"
              style="
                width: 100%;
                border-collapse: collapse;
                text-align: left;
                margin-bottom: 20px;
                margin-top: 20px;
              "
            >
              <thead>
                <tr
                  style="
                    background-color: #f8f9fa;
                    border-bottom: 2px solid #dee2e6;
                  "
                >
                  <th style="padding: 10px; border: 1px solid #dee2e6">
                    Mã Hóa Đơn
                  </th>
                  <th style="padding: 10px; border: 1px solid #dee2e6">
                    Ngày Mua
                  </th>
                  <th style="padding: 10px; border: 1px solid #dee2e6">
                    Tổng Tiền
                  </th>
                  <th style="padding: 10px; border: 1px solid #dee2e6">
                    Chi Tiết Sản Phẩm
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr
                  th:each="hoaDon : ${purchaseHistory}"
                  style="border-bottom: 1px solid #dee2e6"
                >
                  <td
                    style="padding: 10px; border: 1px solid #dee2e6"
                    th:text="${hoaDon.maHoaDon}"
                  ></td>
                  <td
                    style="padding: 10px; border: 1px solid #dee2e6"
                    th:text="${hoaDon.ngayMua}"
                  ></td>
                  <td
                    style="padding: 10px; border: 1px solid #dee2e6"
                    th:text="${hoaDon.tongTien}"
                  ></td>
                  <td style="padding: 10px; border: 1px solid #dee2e6">
                    <div
                      style="
                        display: grid;
                        grid-template-columns: repeat(
                          auto-fill,
                          minmax(200px, 1fr)
                        );
                        gap: 10px;
                      "
                    >
                      <div
                        th:each="chiTiet : ${hoaDon.chiTietSanPham}"
                        style="
                          background: #f8f9fa;
                          padding: 10px;
                          border-radius: 5px;
                          border: 1px solid #dee2e6;
                        "
                      >
                        <p
                          style="margin: 0; font-weight: bold"
                          th:text="${chiTiet.tenSanPham}"
                        ></p>
                        <p
                          style="margin: 5px 0 0; font-size: 14px"
                          th:text="'Số lượng: ' + ${chiTiet.soLuong}"
                        ></p>
                        <p
                          style="margin: 0; font-size: 14px; color: #007bff"
                          th:text="'Giá bán: ' + ${chiTiet.giaBan}"
                        ></p>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:if="${purchaseHistory == null or purchaseHistory.isEmpty()}">
            <p>Không có lịch sử mua hàng.</p>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
