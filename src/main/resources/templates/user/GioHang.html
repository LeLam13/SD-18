<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{/user/trangChu}">

<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng | ALLDY STORE </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>


</head>

<body>
    <div layout:fragment="contentUser" class="bg0 m-t-23 p-b-140 container" >
        <style>
            .voucher-container {
                position: relative;
            }

            .voucher-details {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                background-color: #fff;
                border: 1px solid #ccc;
                padding: 10px;
                z-index: 1;
            }

            .voucher-container:hover .voucher-details {
                display: block;
            }

            .table-responsive{
                margin-top: 20px;
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                font-size: 18px;
            }
            .table-responsive label{
                font-size: 16px;
                color: black;
            }
            .table-responsive input{
                font-size: 14px;
            }
            .table-responsive textarea{
                font-size: 14px;
            }
            #order{
                font-size: 18px;
            }

            .voucher{
                margin-top: 20px;
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                font-size: 18px;
            }
        </style>
        <div class="row" ng-controller="don-hang-online-ctrl">
            <div class="row">
                <div class="table-responsive">
                    <h3>Danh Sách Đơn Hàng</h3>
                    <div class="row">
                        <table class="table">
                            <thead>
                            <tr>
                                <th scope="col">STT</th>
                                <th scope="col">Tên Sản Phẩm</th>
                                <th scope="col">Số Lượng</th>
                                <th scope="col">đơn giá</th>
                                <th scope="col">Tổng</th>
                                <th scope="col"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr ng-repeat="orderProduct in itemsOrder">
                                <th scope="row">${index+1}</th>
                                <td>{{mess}}</td>
                                <td>Otto</td>
                                <td>@mdo</td>
                                <td>@mdo</td>
                                <td>
                                    <button type="button" class="btn btn-danger" style="width: 5px;">
                                        <i class="bi bi-trash3" style="font-size: 12px"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row">

                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-7">
                    <div class="table-responsive">
                        <h3>Thông Tin Thanh Toán</h3>
                        <div class="row">
                            <div class="row mt-1">
                                <div class="col-6">
                                    <div class="mb-2">
                                        <label  class="form-label">Họ Và Tên</label>
                                        <input type="Text" id="hoVaTen" class="form-control" >
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="mb-2">
                                        <label  class="form-label">email</label>
                                        <input type="Text" id="email" class="form-control" >
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <div class="mb-2">
                                        <label  class="form-label">Địa Chỉ</label>
                                        <input type="Text" id="diaChi" class="form-control" >
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="mb-2">
                                        <label  class="form-label">Số điện thoại</label>
                                        <input type="Text" id="soDienThoai" class="form-control" >
                                    </div>
                                </div>
                            </div>
                            <div class="col-7">
                                <div class="mb-2">
                                    <label  class="form-label">Phương Thức Thanh Toán</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="phuongThuc1" checked>
                                        <label class="form-check-label" for="phuongThuc1">
                                            Thanh Toán Sau Khi Nhận Hàng
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="phuongThuc2" >
                                        <label class="form-check-label" for="phuongThuc2">
                                            Thanh Toán Online
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label for="exampleFormControlTextarea1" class="form-label">Ghi Chú đơn Hàng:</label>
                                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                            </div>
                            <div class="mb-2">
                                <button type="button" id="order" class="btn btn-primary">Đặt Hàng</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-5">
                    <div class="voucher">

                    </div>
                </div>

            </div>
        </div>

    </div>
</body>

</html>
