<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{/user/trangChu}">
<head>
    <meta charset="UTF-8">
    <title>Liên Hệ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        tr {
            border-bottom: 1px solid #ccc;
        }

        td {
            padding: 10px;
        }

        .info-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            transition: transform 0.3s ease;
        }

        .info-text {
            font-style: italic;
        }

        .info-icon:hover {
            transform: scale(1.2);
        }

        .fanpage-container {
            background-color: #bebebe;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), 0 6px 20px rgb(0, 0, 0);
            /* Thêm một lớp bóng đổ nữa */
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            transition: box-shadow 0.3s ease-in-out;
            /* Thêm hiệu ứng chuyển tiếp */
        }

        .fanpage-container:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2), 0 12px 40px rgb(0, 0, 0);
            /* Thay đổi bóng đổ khi hover */
        }

        .fanpage-link {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #333;
            font-style: italic;
        }

        .fanpage-link img {
            width: 1705x;
            height: 175px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .fanpage-link span {
            font-size: 18px;
        }

        .email-link-lienhe {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #000000;
            transition: color 0.3s;
        }

        .email-link-lienhe:hover {
            color: #ff0000;
        }

        .email-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            transition: transform 0.3s;
        }

        .email-link:hover .email-icon {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div layout:fragment="contentUser" class="bg0 p-b-140" ng-app="filter-app" ng-controller="filter-ctrl">
        <style>
            .header-cart-buttons {
                display: flex;
                justify-content: center;
            }

            .page {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
        </style>

        <!-- Product -->
        <section class="container d-flex justify-content-center mt-5">
            <div class="row col-12">
                <div class="col-6">
                    <h3 class="mb-5">Liên hệ</h3>
                    <div class="d-flex align-items-center">
                        <table>
                            <tr>
                                <td class="mr-2">
                                    <img src="/admin/images/phone.png" alt="Phone Icon" class="info-icon">
                                </td>
                                <td><span class="info-text" style="color: #000000;">0981357825</span></td>
                            </tr>
                            <tr>
                                <td>
                                    <img src="/admin/images/address.png" alt="Address Icon" class="info-icon">
                                </td>
                                <td><span class="info-text" style="color: #000000;">Địa chỉ: Đường Trịnh Văn Bô,Q. Nam Từ Liêm TP. Hà Nội</span></td>
                            </tr>
                        </table>
                    </div>
                    <div class="parent-container">
                        <div class="fanpage-container">
                            <a href="https://www.facebook.com/profile.php?id=61569788512145" class="fanpage-link">
                                <h1>Eighteen Polo</h1>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.8639311820666!2d105.74468687431764!3d21.03812978061353!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x313455e940879933%3A0xcf10b34e9f1a03df!2zVHLGsOG7nW5nIENhbyDEkeG6s25nIEZQVCBQb2x5dGVjaG5pYw!5e0!3m2!1svi!2s!4v1734197061159!5m2!1svi!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </section>
        <footer>
            <div class="footer__copyright">
                <p>&copy; 2024 Eighteen Polo.</p>
            </div>
        </footer>

        <!--    /////////Modal đăng nhập///////////////-->

    </div>
</body>

</html>
