<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/admin/index}"
>
<head>
    <meta charset="utf-8" />
    <title>Eighteen polo | Thống Kê</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />

    <!-- ApexCharts and DatePicker libraries -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let chart;

            const startDate = flatpickr("#startDate", {
                dateFormat: "Y-m-d",
                defaultDate: new Date(new Date().setDate(new Date().getDate() - 1)),
            });

            const endDate = flatpickr("#endDate", {
                dateFormat: "Y-m-d",
                defaultDate: new Date(),
            });

            // Fetch revenue data for the selected date range
            document
                .getElementById("fetchRevenue")
                .addEventListener("click", function () {
                    const start = document.getElementById("startDate").value;
                    const end = document.getElementById("endDate").value;

                    if (start && end) {
                        fetch(`/api/revenue?start=${start}&end=${end}`)
                            .then((response) => response.json())
                            .then((data) => {
                                console.log("Fetched revenue data:", data);
                                updateRevenueChart(data);
                            })
                            .catch((error) =>
                                console.error("Error fetching revenue data:", error)
                            );
                    } else {
                        alert("Vui lòng chọn đầy đủ ngày bắt đầu và ngày kết thúc.");
                    }
                });

            function updateRevenueChart(data) {
                const options = {
                    series: [{ name: "Doanh thu", data: data.revenueValues }],
                    chart: { type: "line", height: 350 },
                    stroke: { curve: "smooth" },
                    xaxis: { categories: data.dates },
                    yaxis: {
                        labels: { formatter: (value) => value.toLocaleString() + " đ" },
                    },
                    tooltip: {
                        y: { formatter: (value) => value.toLocaleString() + " đ" },
                    },
                };

                if (chart) {
                    chart.destroy();
                }

                chart = new ApexCharts(
                    document.querySelector("#revenueChart"),
                    options
                );
                chart.render();
            }
            // Currency formatting
            function formatCurrency(value) {
                return Number(value).toLocaleString("vi-VN", {
                    style: "currency",
                    currency: "VND",
                });
            }
            const revenueToday = document.getElementById("revenueToday");
            const revenueYesterday = document.getElementById("revenueYesterday");
            const revenueThisMonth = document.getElementById("revenueThisMonth");
            const revenueLastMonth = document.getElementById("revenueLastMonth");
            const revenueThisYear = document.getElementById("revenueThisYear");
            const revenueLastYear = document.getElementById("revenueLastYear");

            if (revenueToday)
                revenueToday.textContent = formatCurrency(
                    revenueToday.textContent.replace(" ₫", "").trim()
                );
            if (revenueYesterday)
                revenueYesterday.textContent =
                    "Hôm qua: " +
                    formatCurrency(
                        revenueYesterday.textContent
                            .replace("Hôm qua: ", "")
                            .replace(" ₫", "")
                            .trim()
                    );
            if (revenueThisMonth)
                revenueThisMonth.textContent = formatCurrency(
                    revenueThisMonth.textContent.replace(" ₫", "").trim()
                );
            if (revenueLastMonth)
                revenueLastMonth.textContent =
                    "Tháng trước: " +
                    formatCurrency(
                        revenueLastMonth.textContent
                            .replace("Tháng trước: ", "")
                            .replace(" ₫", "")
                            .trim()
                    );
            if (revenueThisYear)
                revenueThisYear.textContent = formatCurrency(
                    revenueThisYear.textContent.replace(" ₫", "").trim()
                );
            if (revenueLastYear)
                revenueLastYear.textContent =
                    "Năm trước: " +
                    formatCurrency(
                        revenueLastYear.textContent
                            .replace("Năm trước: ", "")
                            .replace(" ₫", "")
                            .trim()
                    );
            // Formatting growth rate and applying colors
            function formatGrowthRate(elementId) {
                const element = document.getElementById(elementId);
                if (element) {
                    const value = parseFloat(
                        element.textContent.replace("%", "").trim()
                    );
                    element.style.fontWeight = "bold";
                    element.style.fontSize = "1.2em";

                    element.style.color = value < 0 ? "red" : "green";
                }
            }

            formatGrowthRate("dailyGrowthRate");
            formatGrowthRate("monthlyGrowthRate");
            formatGrowthRate("yearlyGrowthRate");
        });
    </script>
</head>

<body>
<!-- Main Content -->
<div class="main-content" layout:fragment="content">
    <h1 class="mb-4">Dashboard</h1>
    <div class="container-fluid">
        <!-- Date pickers for selecting the date range -->
        <div class="row mb-4">
            <div class="col-md-4">
                <label for="startDate">Chọn ngày bắt đầu:</label>
                <input
                        type="text"
                        id="startDate"
                        class="form-control"
                        placeholder="Start Date"
                />
            </div>
            <div class="col-md-4">
                <label for="endDate">Chọn ngày kết thúc:</label>
                <input
                        type="text"
                        id="endDate"
                        class="form-control"
                        placeholder="End Date"
                />
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button id="fetchRevenue" class="btn btn-primary mt-2">
                    Lấy Doanh Thu
                </button>
            </div>
        </div>

        <!-- Cards for displaying revenue data -->
        <div class="row">
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex align-items-center">
                        <i class="fa fa-box fa-2x text-primary me-3"></i>
                        <div>
                            <p class="mb-1">Tổng số sản phẩm</p>
                            <h5 class="fw-bold" th:text="${totalProducts} + ' sản phẩm'">
                                0 sản phẩm
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex align-items-center">
                        <i class="fa fa-shopping-cart fa-2x text-primary me-3"></i>
                        <div>
                            <p class="mb-1">Tổng số đơn hàng</p>
                            <h5 class="fw-bold" th:text="${totalInvoices} + ' đơn hàng'">
                                0 đơn hàng
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex align-items-center">
                        <i class="fa fa-users fa-2x text-primary me-3"></i>
                        <div>
                            <p class="mb-1">Tổng số khách hàng</p>
                            <h5
                                    class="fw-bold"
                                    th:text="${totalCustomers} + ' khách hàng'"
                            >
                                0 khách hàng
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex align-items-center">
                        <i class="fa fa-coins fa-2x text-primary me-3"></i>
                        <div>
                            <p class="mb-1">Doanh thu hôm nay</p>
                            <h5
                                    id="revenueToday"
                                    class="fw-bold"
                                    th:text="${revenueToday} + ' ₫'"
                            >
                                0 ₫
                            </h5>
                            <small
                                    id="revenueYesterday"
                                    class="text-muted"
                                    th:text="'Hôm qua: ' + ${revenueYesterday} + ' ₫'"
                            >Hôm qua: 0 ₫</small
                            >
                            <small
                                    id="dailyGrowthRate"
                                    class="text-muted d-block"
                                    th:text="${dailyGrowthRate} + '%'"
                            >0%</small
                            >
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex align-items-center">
                        <i class="fa fa-calendar-alt fa-2x text-primary me-3"></i>
                        <div>
                            <p class="mb-1">Doanh thu tháng này</p>
                            <h5
                                    id="revenueThisMonth"
                                    class="fw-bold"
                                    th:text="${revenueThisMonth} + ' ₫'"
                            >
                                0 ₫
                            </h5>
                            <small
                                    id="revenueLastMonth"
                                    class="text-muted"
                                    th:text="'Tháng trước: ' + ${revenueLastMonth} + ' ₫'"
                            >Tháng trước: 0 ₫</small
                            >
                            <small
                                    id="monthlyGrowthRate"
                                    class="text-muted d-block"
                                    th:text="${monthlyGrowthRate} + '%'"
                            >0%</small
                            >
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm mb-3">
                    <div class="card-body d-flex align-items-center">
                        <i class="fa fa-chart-line fa-2x text-primary me-3"></i>
                        <div>
                            <p class="mb-1">Doanh thu năm</p>
                            <h5
                                    id="revenueThisYear"
                                    class="fw-bold"
                                    th:text="${revenueThisYear} + ' ₫'"
                            >
                                0 ₫
                            </h5>
                            <small
                                    id="revenueLastYear"
                                    class="text-muted"
                                    th:text="'Năm trước: ' + ${revenueLastYear} + ' ₫'"
                            >Năm trước: 0 ₫</small
                            >
                            <small
                                    id="yearlyGrowthRate"
                                    class="text-muted d-block"
                                    th:text="${yearlyGrowthRate} + '%'"
                            >0%</small
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Placeholder for chart -->
        <div class="card mt-4">
            <div class="card-body">
                <h5>Doanh thu</h5>
                <div id="revenueChart"></div>
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-body">
                <h5>Top 5 Sản Phẩm Bán Chạy</h5>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Số lượng bán</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${topSellingProducts}">
                        <td th:text="${product[0]}"></td>
                        <td th:text="${product[1]}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
