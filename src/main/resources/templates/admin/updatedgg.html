<!doctype html>
<html lang="en" xmlns:th="http:/www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">

<head>

    <meta charset="utf-8"/>
    <title>ALLDY SNEAKER | Màu Sắc</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description"/>
    <meta content="Themesbrand" name="author"/>
    <!--    Bootstrap 5-->
</head>

<body data-topbar="dark">
<!-- ============================================================== -->
<!-- Start right Content here -->
<!-- ============================================================== -->
<div class="main-content" layout:fragment="content">
    <div>
        <div class="page-content">
            <div class="container-fluid">

                <!-- start page title -->
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                            <h4 class="mb-sm-0 font-size-18">Update Đợt Giảm Giá</h4>

                        </div>
                    </div>
                </div>
                <!-- end page title -->

                <div class="row">

                    <form th:action="@{/admin/dot-giam-gia/update}" method="post">
                        <input type="hidden" id="updateDiscountId" name="idGiamGia" th:value="${dotGiamGia.idGiamGia}">

                        <div class="form-group">
                            <div>
                                <label>Chọn kiểu giảm giá:</label>
                                <div>
                                    <input type="radio" id="updateDiscountPercent" name="discountType" value="percent"
                                           onclick="toggleUpdateFields()"
                                           th:checked="${dotGiamGia.loaiGiamGia == 0}">
                                    <label for="updateDiscountPercent">Theo phần trăm</label>
                                </div>
                                <div>
                                    <input type="radio" id="updateDiscountAmount" name="discountType" value="amount"
                                           onclick="toggleUpdateFields()"
                                           th:checked="${dotGiamGia.loaiGiamGia == 1}">
                                    <label for="updateDiscountAmount">Theo tiền</label>
                                </div>
                            </div>

                            <div class="form-group" id="percentField" style="display: none;">
                                <label for="giamGiaPercent">Giảm Giá (%):</label>
                                <input type="text" class="form-control" id="giamGiaPercent" name="giamGiaPercent"
                                       th:value="${dotGiamGia.giamGia}"
                                       >
                            </div>

                            <div class="form-group" id="amountField" style="display: none;">
                                <label for="giamGiaAmount">Giảm Giá (tiền):</label>
                                <input type="text" class="form-control" id="giamGiaAmount" name="giamGiaAmount"
                                       th:value="${dotGiamGia.giamGia}"
                                      >
                            </div>

                            <div class="form-group">
                                <label for="updateThoiGianBatDau">Thời Gian Bắt Đầu:</label>
                                <input type="datetime-local" class="form-control" id="updateThoiGianBatDau" name="thoiGianBatDau" th:value="${dotGiamGia.thoiGianBatDau}">
                            </div>
                            <div class="form-group">
                                <label for="updateThoiGianKetThuc">Thời Gian Kết Thúc:</label>
                                <input type="datetime-local" class="form-control" id="updateThoiGianKetThuc" name="thoiGianKetThuc" th:value="${dotGiamGia.thoiGianKetThuc}">
                            </div>

                            <button type="submit" class="btn btn-primary">Cập Nhật</button>
                            <div th:if="${error2}" class="alert alert-danger">
                                <p th:text="${error2}"></p>
                            </div>


                        </div>
                    </form>

                    <script>
                        function toggleUpdateFields() {
                            // Lấy loại giảm giá đã chọn
                            const discountType = document.querySelector('input[name="discountType"]:checked').value;

                            // Lấy các trường cần hiển thị hoặc ẩn
                            const percentField = document.getElementById("percentField");
                            const amountField = document.getElementById("amountField");

                            // Lấy các trường nhập liệu
                            const giamGiaPercent = document.getElementById("giamGiaPercent");
                            const giamGiaAmount = document.getElementById("giamGiaAmount");

                            // Hiển thị hoặc ẩn trường dựa trên loại giảm giá
                            if (discountType === "percent") {
                                percentField.style.display = "block";
                                amountField.style.display = "none";
                                giamGiaPercent.required = true;
                                giamGiaAmount.required = false;
                            } else {
                                percentField.style.display = "none";
                                amountField.style.display = "block";
                                giamGiaPercent.required = false;
                                giamGiaAmount.required = true;
                            }
                        }

                        // Gọi hàm khi trang được tải để thiết lập đúng trạng thái
                        document.addEventListener("DOMContentLoaded", function () {
                            toggleUpdateFields();
                        });
                    </script>



                </div> <!-- end col -->
            </div> <!-- end row -->
        </div>

    <style>
        .text-warning {
            color: #FFC107; /* Màu vàng */
        }

        .text-success {
            color: #28A745; /* Màu xanh lá */
        }

        .text-danger {
            color: #DC3545; /* Màu đỏ */
        }
    </style>
    <!-- container-fluid -->
</div>
<!-- End Page-content -->
</div>
</div>
</div>
<!-- end main content-->
</body>

</html>
