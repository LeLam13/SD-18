<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/admin/index}"
>
  <head>
    <title>Thêm/Sửa Khách Hàng</title>
  </head>
  <body>
    <div class="main-content" layout:fragment="content">
      <div class="container" style="margin-top: 10rem">
        <h2
          class="mb-4"
          th:text="${khachHang != null ? 'Sửa Khách Hàng' : 'Thêm Khách Hàng'}"
        ></h2>

        <!-- Hiển thị lỗi nếu có -->
        <div
          class="alert alert-danger"
          th:if="${error != null}"
          th:text="${error}"
        ></div>

        <form th:action="@{/admin/khach-hang/save}" method="post">
          <input
            type="hidden"
            name="idKhachHang"
            th:value="${khachHang != null ? khachHang.idKhachHang : ''}"
          />

          <div class="mb-3">
            <label for="maKhachHang" class="form-label">Mã Khách Hàng</label>
            <input
              type="text"
              class="form-control"
              id="maKhachHang"
              name="maKhachHang"
              th:value="${khachHang != null ? khachHang.maKhachHang : ''}"
              required
            />
          </div>

          <div class="mb-3">
            <label for="hoTen" class="form-label">Họ Tên</label>
            <input
              type="text"
              class="form-control"
              id="hoTen"
              name="hoTen"
              th:value="${khachHang != null ? khachHang.hoTen : ''}"
              required
            />
          </div>

          <div class="mb-3">
            <label for="ngaySinh" class="form-label">Ngày Sinh</label>
            <input
              type="date"
              class="form-control"
              id="ngaySinh"
              name="ngaySinh"
              th:value="${khachHang != null ? #dates.format(khachHang.ngaySinh, 'yyyy-MM-dd') : ''}"
              required
            />
          </div>

          <div class="mb-3">
            <label for="soDienThoai" class="form-label">Số Điện Thoại</label>
            <input
              type="text"
              class="form-control"
              id="soDienThoai"
              name="soDienThoai"
              th:value="${khachHang != null ? khachHang.soDienThoai : ''}"
              required
            />
          </div>

          <div class="mb-3">
            <label for="gioiTinh" class="form-label">Giới Tính</label>
            <select class="form-control" id="gioiTinh" name="gioiTinh">
              <option
                th:selected="${khachHang.gioiTinh != null ? khachHang.gioiTinh : true}"
                value="true"
              >
                Nam
              </option>
              <option
                th:selected="${khachHang.gioiTinh != null ? !khachHang.gioiTinh : false}"
                value="false"
              >
                Nữ
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label for="diaChi" class="form-label">Địa Chỉ</label>
            <input
              type="text"
              class="form-control"
              id="diaChi"
              name="diaChi"
              th:value="${khachHang != null ? khachHang.diaChi : ''}"
              required
            />
          </div>

          <div class="mb-3">
            <label for="usernameTaiKhoan" class="form-label"
              >Tên Tài Khoản</label
            >
            <input
              type="text"
              class="form-control"
              id="usernameTaiKhoan"
              name="usernameTaiKhoan"
              th:value="${khachHang != null ? khachHang.usernameTaiKhoan : ''}"
              required
            />
          </div>

          <button type="submit" class="btn btn-success">Lưu</button>
          <a href="/admin/khach-hang" class="btn btn-secondary">Hủy</a>
        </form>
      </div>
    </div>
  </body>
</html>
