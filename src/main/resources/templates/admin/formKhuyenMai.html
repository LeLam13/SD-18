<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/admin/index}"
>
  <head>
    <title>Thêm/Sửa Khuyến Mãi</title>
  </head>
  <body>
    <div class="main-content mb-4" layout:fragment="content">
      <div class="container" style="margin-top: 10rem">
        <h2
          class="mb-4"
          th:text="${khuyenMai != null ? 'Sửa Khuyến Mãi' : 'Thêm Khuyến Mãi'}"
        ></h2>

        <!-- Hiển thị lỗi nếu có -->
        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

        <form th:action="@{/admin/khuyen-mai/save}" method="post">
          <input
            type="hidden"
            name="idKhuyenMai"
            th:value="${khuyenMai != null ? khuyenMai.idKhuyenMai : ''}"
          />

          <!-- Mã Khuyến Mãi -->
          <div class="mb-3">
            <label for="maKhuyenMai" class="form-label">Mã Khuyến Mãi</label>
            <input
              type="text"
              class="form-control"
              id="maKhuyenMai"
              name="maKhuyenMai"
              th:value="${khuyenMai != null ? khuyenMai.maKhuyenMai : ''}"
              required
            />
          </div>

          <!-- Tên Khuyến Mãi -->
          <div class="mb-3">
            <label for="tenKhuyenMai" class="form-label">Tên Khuyến Mãi</label>
            <input
              type="text"
              class="form-control"
              id="tenKhuyenMai"
              name="tenKhuyenMai"
              th:value="${khuyenMai != null ? khuyenMai.tenKhuyenMai : ''}"
              required
            />
          </div>

          <!-- Mức Giảm -->
          <div class="mb-3">
            <label for="mucGiamGia" class="form-label"
              >Mức Giảm (%) hoặc VND</label
            >
            <input
              type="number"
              class="form-control"
              id="mucGiamGia"
              name="mucGiamGia"
              th:value="${khuyenMai != null ? khuyenMai.mucGiamGia : ''}"
              min="0"
              required
            />
          </div>

          <!-- Số Lượng -->
          <div class="mb-3">
            <label for="soLuong" class="form-label">Số Lượng</label>
            <input
              type="number"
              class="form-control"
              id="soLuong"
              name="soLuong"
              th:value="${khuyenMai != null ? khuyenMai.soLuong : ''}"
              min="0"
              required
            />
          </div>

          <!-- Thời Gian Bắt Đầu -->
          <div class="mb-3">
            <label for="thoiGianBatDau" class="form-label"
              >Thời Gian Bắt Đầu</label
            >
            <input
              type="text"
              class="form-control"
              id="thoiGianBatDau"
              name="thoiGianBatDau"
              placeholder="MM/dd/yyyy"
              th:value="${khuyenMai != null && khuyenMai.thoiGianBatDau != null ? #dates.format(khuyenMai.thoiGianBatDau, 'MM/dd/yyyy') : ''}"
              required
            />
          </div>

          <!-- Thời Gian Kết Thúc -->
          <div class="mb-3">
            <label for="thoiGianKetThuc" class="form-label"
              >Thời Gian Kết Thúc</label
            >
            <input
              type="text"
              class="form-control"
              id="thoiGianKetThuc"
              name="thoiGianKetThuc"
              placeholder="MM/dd/yyyy"
              th:value="${khuyenMai != null && khuyenMai.thoiGianKetThuc != null ? #dates.format(khuyenMai.thoiGianKetThuc, 'MM/dd/yyyy') : ''}"
              required
            />
          </div>

          <!-- Điều Kiện Áp Dụng -->
          <div class="mb-3">
            <label for="soTienToiThieu" class="form-label"
              >Điều Kiện Áp Dụng (Số Tiền Tối Thiểu)</label
            >
            <input
              type="number"
              class="form-control"
              id="soTienToiThieu"
              name="soTienToiThieu"
              th:value="${khuyenMai != null ? khuyenMai.soTienToiThieu : ''}"
              min="0"
              placeholder="Nhập số tiền tối thiểu (VND)"
            />
          </div>

          <!-- Mô Tả -->
          <div class="mb-3">
            <label for="moTa" class="form-label">Mô Tả</label>
            <textarea
              class="form-control"
              id="moTa"
              name="moTa"
              rows="3"
              th:text="${khuyenMai != null ? khuyenMai.moTa : ''}"
            ></textarea>
          </div>

          <!-- Trạng Thái -->
          <div class="mb-3">
            <label for="trangThai" class="form-label">Trạng Thái</label>
            <select class="form-control" id="trangThai" name="trangThai">
              <option
                th:selected="${khuyenMai.trangThai != null ? khuyenMai.trangThai : false}"
                value="true"
              >
                Đang hoạt động
              </option>
              <option
                th:selected="${khuyenMai.trangThai != null ? !khuyenMai.trangThai : true}"
                value="false"
              >
                Ngừng hoạt động
              </option>
            </select>
          </div>

          <!-- Nút Hành Động -->
          <button type="submit" class="btn btn-success">Lưu</button>
          <a href="/admin/khuyen-mai" class="btn btn-secondary">Hủy</a>
        </form>
      </div>
    </div>
    <script>
      function validateForm() {
        const mucGiamGia = document.getElementById("mucGiamGia").value;
        const soLuong = document.getElementById("soLuong").value;
        const thoiGianBatDau = new Date(
          document.getElementById("thoiGianBatDau").value
        );
        const thoiGianKetThuc = new Date(
          document.getElementById("thoiGianKetThuc").value
        );

        if (mucGiamGia <= 0) {
          alert("Mức giảm giá phải lớn hơn 0.");
          return false;
        }

        if (soLuong <= 0) {
          alert("Số lượng phải lớn hơn 0.");
          return false;
        }

        if (thoiGianBatDau >= thoiGianKetThuc) {
          alert("Thời gian bắt đầu phải nhỏ hơn thời gian kết thúc.");
          return false;
        }

        return true;
      }
    </script>
  </body>
</html>
