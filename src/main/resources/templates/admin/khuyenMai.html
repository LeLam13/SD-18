<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{/admin/index}"
>
  <head>
    <title>Quản Lý Khuyến Mãi</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      .icon-action {
        cursor: pointer;
        font-size: 18px;
        margin-right: 10px;
      }

      .icon-edit {
        color: #ffc107;
      }

      .icon-edit:hover {
        color: #e0a800;
      }

      .icon-view {
        color: #17a2b8;
      }

      .icon-view:hover {
        color: #138496;
      }

      .icon-delete {
        color: #dc3545;
      }

      .icon-delete:hover {
        color: #c82333;
      }

      .pagination .page-link {
        margin: 0 2px;
      }

      .badge-condition {
        font-size: 0.85em;
      }
    </style>
  </head>
  <body data-topbar="dark">
    <div class="main-content" layout:fragment="content">
      <div class="page-content">
        <div class="container-fluid">
          <!-- start page title -->
          <div class="row">
            <div class="col-12">
              <div
                class="page-title-box d-sm-flex align-items-center justify-content-between"
              >
                <h4 class="mb-sm-0 font-size-18">Quản Lý Khuyến Mãi</h4>
              </div>
            </div>
          </div>
          <!-- end page title -->
          <div class="alert alert-success" th:if="${status == 'success'}">
            <span th:text="${message}"></span>
          </div>
          <div class="alert alert-danger" th:if="${status == 'error'}">
            <span th:text="${message}"></span>
          </div>

          <div class="row">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <div class="row">
                    <div class="col-6">
                      <a href="/admin/khuyen-mai/form" class="btn btn-primary">
                        Thêm Khuyến Mãi
                      </a>
                    </div>
                  </div>
                </div>
                <div class="card-body" style="min-height: 450px">
                  <table class="table table-hover dt-responsive nowrap w-100">
                    <thead>
                      <tr>
                        <th>STT</th>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Mức Giảm</th>
                        <th>Số Lượng</th>
                        <th>Thời gian bắt đầu</th>
                        <th>Thời gian kết thúc</th>
                        <th>Trạng thái</th>
                        <th>Điều kiện Áp dụng</th>
                        <th>Thao Tác</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Thymeleaf loop -->
                      <tr th:each="khuyenMai, indexStat : ${danhSach}">
                        <td th:text="${indexStat.index + 1}"></td>
                        <td th:text="${khuyenMai.maKhuyenMai}"></td>
                        <td th:text="${khuyenMai.tenKhuyenMai}"></td>
                        <td>
                          <span th:if="${khuyenMai.mucGiamGia != null}">
                            <span
                              th:if="${khuyenMai.mucGiamGia <= 100}"
                              th:text="${khuyenMai.mucGiamGia + '%'}"
                            ></span>
                            <span
                              th:if="${khuyenMai.mucGiamGia > 100}"
                              th:text="${khuyenMai.mucGiamGia + ' VND'}"
                            ></span>
                          </span>
                          <span th:if="${khuyenMai.mucGiamGia == null}"
                            >N/A</span
                          >
                        </td>
                        <td th:text="${khuyenMai.soLuong}"></td>
                        <td
                          th:text="${#dates.format(khuyenMai.thoiGianBatDau, 'yyyy-MM-dd')}"
                        ></td>
                        <td
                          th:text="${#dates.format(khuyenMai.thoiGianKetThuc, 'yyyy-MM-dd')}"
                        ></td>
                        <td>
                          <span
                            th:text="${khuyenMai.trangThai ? 'Đang hoạt động' : 'Ngừng hoạt động'}"
                          ></span>
                        </td>
                        <td>
                          <span th:if="${khuyenMai.soTienToiThieu != null}">
                            Tối thiểu:
                            <span th:text="${khuyenMai.soTienToiThieu}"></span>
                            VND
                          </span>
                          <span th:if="${khuyenMai.soTienToiThieu == null}"
                            >Không yêu cầu</span
                          >
                        </td>
                        <td>
                          <!-- Xem -->
                          <a
                            th:href="@{/admin/khuyen-mai/view/{id}(id=${khuyenMai.idKhuyenMai})}"
                            class="icon-action icon-view"
                          >
                            <i class="fas fa-eye"></i>
                          </a>

                          <!-- Sửa -->
                          <a
                            th:href="@{/admin/khuyen-mai/form/{id}(id=${khuyenMai.idKhuyenMai})}"
                            class="icon-action icon-edit"
                          >
                            <i class="fas fa-edit"></i>
                          </a>

                          <!-- Xóa -->
                          <form
                            th:action="@{/admin/khuyen-mai/delete/{id}(id=${khuyenMai.idKhuyenMai})}"
                            method="post"
                            onsubmit="return confirm('Bạn có chắc chắn muốn xóa khuyến mãi này?');"
                            style="display: inline-block"
                          >
                            <button
                              type="submit"
                              class="icon-action icon-delete"
                              style="background: none; border: none"
                            >
                              <i class="fas fa-trash-alt"></i>
                            </button>
                          </form>
                        </td>
                      </tr>
                    </tbody>
                  </table>

                  <!-- Pagination -->
                  <nav
                    aria-label="Page navigation"
                    class="d-flex justify-content-center mt-3"
                  >
                    <ul class="pagination">
                      <!-- Nút Trước -->
                      <li
                        th:classappend="${currentPage == 0} ? 'disabled'"
                        class="page-item"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/khuyen-mai(page=${currentPage - 1})}"
                          aria-label="Previous"
                        >
                          <span aria-hidden="true">&laquo;</span>
                        </a>
                      </li>
                      <!-- Các trang -->
                      <li
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${currentPage == i} ? 'active'"
                        class="page-item"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/khuyen-mai(page=${i})}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <!-- Nút Sau -->
                      <li
                        th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'"
                        class="page-item"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/khuyen-mai(page=${currentPage + 1})}"
                          aria-label="Next"
                        >
                          <span aria-hidden="true">&raquo;</span>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
