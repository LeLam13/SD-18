<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">
<head>
    <title>ALLDY SNEAKER | Form sản phẩm</title>

</head>
<style></style>
<body data-topbar="dark">

<!-- ============================================================== -->
<!-- Start right Content here -->
<!-- ============================================================== -->
<div class="main-content" layout:fragment="content">
    <div class="page-content" ng-app="formSP-app" ng-controller="san-pham-ctrl">
        <!--        <style>-->
        <!--            .er {-->
        <!--                color: red;-->
        <!--                font-size: 13px;-->
        <!--            }-->
        <!--        </style>-->
        <!--        <link th:href="@{/admin/css/fileupload.css}" rel="stylesheet" type="text/css"/>-->
        <!--        <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">-->
        <div class="container-fluid">
            <div class="row justify-content-center w-100">
                <div class="col-9">
                    <div class="card">
                        <!-- Chọn màu sắc -->
                        <div class="mb-3 m-4">
                            <label>Chọn Màu:</label>
                            <input type="text" ng-model="colorSearch" placeholder="Nhập màu để tìm kiếm"
                                   ng-change="autoSelectColor()">
                            <select class="form-control" ng-model="selectedMauSac" multiple ng-change="selectColor()">
                                <option ng-repeat="mau in mauSac | filter:colorFilterFunction" ng-value="mau">{{ mau.ten
                                    }}
                                </option>
                            </select>
                        </div>

                        <!-- Chọn kích cỡ -->
                        <div class="mb-3 m-4">
                            <label>Chọn Kích Cỡ:</label>
                            <input type="text" ng-model="sizeSearch" placeholder="Nhập kích cỡ để tìm kiếm"
                                   ng-change="autoSelectSize()">
                            <select class="form-control" ng-model="selectedKichCo" multiple ng-change="selectSize()">
                                <option ng-repeat="size in kichCo | filter:sizeFilterFunction" ng-value="size">
                                    {{ size.ten
                                    }}
                                </option>
                            </select>
                        </div>

                    </div>
                </div>
            </div>
            <div class="row p-3 m-5">
                <div class="col-12">
                    <div class="card">
                        <!-- Hiển thị bảng theo từng màu -->
                        <div ng-repeat="table in tables" style="margin-top: 20px;">
                            <h3 class="m-4">Màu {{table.mau.ten}}</h3>
                            <table class="table table-striped table-hover dt-responsive  nowrap w-75 m-4">
                                <tr>
                                    <th>Kích Cỡ</th>
                                    <th>Số lượng</th>
                                    <th>Giá nhập</th>
                                    <th>Giá bán</th>
                                    <th>Xóa</th>
                                </tr>
                                <tr ng-repeat="size in table.size">
                                    <td>{{size.ten}}</td>
                                    <td><input ng-model="form[table.mau.idMauSac][size.idKichCo].soLuong" type="number"></td>
                                    <td><input ng-model="form[table.mau.idMauSac][size.idKichCo].giaNhap" type="number"></td>
                                    <td><input ng-model="form[table.mau.idMauSac][size.idKichCo].giaBan" type="number"></td>
                                    <td>
                                        <button class="btn btn-danger" ng-click="removeSize(table, size)">Xóa</button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-danger" ng-click="create()">Thêm</button>
        </div>
    </div>

    <!-- End Page-content -->

    <footer class="footer">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-6">
                    <script>document.write(new Date().getFullYear())</script>
                    © ALLDY STORE.
                </div>
                <div class="col-sm-6">
                    <div class="text-sm-end d-none d-sm-block">
                        Design & Develop by <a href="#!" class="text-decoration-underline">Themesbrand</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <script>

    </script>
</div>

</body>

</html>
