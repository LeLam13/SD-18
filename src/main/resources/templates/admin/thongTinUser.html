<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/admin/index}">

<head>

</head>
<style></style>
<body data-topbar="dark">

<!-- ============================================================== -->
<!-- Start right Content here -->
<!-- ============================================================== -->
<div class="main-content" layout:fragment="content">
    <div class="page-content">
        <style>
            .er {
                color: red;
                font-size: 13px;
            }
        </style>
        <div class="row d-flex justify-content-center">
            <div class="col-10">
                <form action="/admin/nhan-vien/updateUser" method="post">
                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${error}" style="color: red;">
                        <p th:text="${error}"></p>
                    </div>

                    <!-- Họ và tên -->
                    <div>
                        <label>Họ và tên:</label>
                        <input type="text" name="hoTen" th:value="${nhanVien.hoTen}"  />
                    </div>

                    <!-- Giới tính -->
                    <div>
                        <label>Giới tính:</label>
                        <select name="gioiTinh">
                            <option value="Nam" th:selected="${nhanVien.gioiTinh == 'Nam'}">Nam</option>
                            <option value="Nữ" th:selected="${nhanVien.gioiTinh == 'Nữ'}">Nữ</option>
                        </select>
                    </div>

                    <!-- Ngày sinh -->
                    <div>
                        <label>Ngày sinh:</label>
                        <input type="date" name="ngaySinh" th:value="${nhanVien.ngaySinh}" required id="ngaySinh" />
                        <div id="ngaySinhError" style="color: red; display: none;">Ngày sinh không được là ngày trong tương lai!</div>
                    </div>

                    <script>
                        // JavaScript validation cho Ngày sinh
                        document.getElementById('ngaySinh').addEventListener('change', function() {
                            var ngaySinhInput = this.value;
                            var currentDate = new Date().toISOString().split('T')[0]; // Lấy ngày hiện tại

                            // Kiểm tra nếu ngày sinh là ngày trong tương lai
                            if (ngaySinhInput > currentDate) {
                                document.getElementById('ngaySinhError').style.display = 'block'; // Hiển thị lỗi
                                this.setCustomValidity("Ngày sinh không được là ngày trong tương lai!");
                            } else {
                                document.getElementById('ngaySinhError').style.display = 'none'; // Ẩn lỗi
                                this.setCustomValidity(""); // Xóa lỗi
                            }
                        });
                    </script>


                    <!-- Số điện thoại -->
                    <div>
                        <label>Số điện thoại:</label>
                        <input type="text" name="soDienThoai"
                               th:value="${nhanVien.soDienThoai}"
                               required
                               pattern="^0[0-9]{9}$"
                               title="Số điện thoại phải bắt đầu bằng 0 và có 10 chữ số " />
                    </div>

                    <!-- Email -->
                    <div>
                        <label>Email:</label>
                        <input type="email" name="email"
                               th:value="${nhanVien.taikhoan.email}"
                               required />
                    </div>

                    <!-- Địa chỉ -->
                    <div>
                        <label>Địa chỉ:</label>
                        <input type="text" name="diaChi" th:value="${nhanVien.diaChi}" required />
                    </div>
                    <!-- Submit button -->
                    <button type="submit">Cập nhật thông tin</button>
                </form>


            </div>
        </div>

    </div>
    <!-- container-fluid -->
</div>
<!-- End Page-content -->

<footer class="footer">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-6">
                <script>document.write(new Date().getFullYear())</script>
                © eight.
            </div>
            <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                    Design & Develop by <a href="#!" class="text-decoration-underline">Themesbrand</a>
                </div>
            </div>
        </div>
    </div>
</footer>

</div>


</body>

</html>
